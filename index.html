<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio de Ilustración</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* Variables de color de Arknights Endfield */
    :root {
        --endfield-bg: #111111;
        --endfield-dark: #1a1a1a;
        --endfield-yellow: #f2e700;
        --endfield-text: #e0e0e0;
        --endfield-white: #ffffff;
        --ui-border: rgba(255, 255, 255, 0.1);
    }

    /* Estilos base */
    body, html {
        margin: 0;
        padding: 0;
        background-color: var(--endfield-bg);
        color: var(--endfield-text);
        font-family: 'Rajdhani', sans-serif;
        overflow-x: hidden;
    }

    /* Patrón topográfico/grid sutil de fondo */
    .bg-pattern {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(var(--ui-border) 1px, transparent 1px),
            linear-gradient(90deg, var(--ui-border) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.15;
        z-index: -1;
        pointer-events: none;
    }

    /* Línea amarilla lateral izquierda (Estilo Endfield) */
    .side-accent {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 6px;
        background-color: var(--endfield-yellow);
        z-index: 10;
    }

    /* Indicador de carga decorativo inferior izquierdo */
    .loading-indicator {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: var(--endfield-yellow);
        font-weight: 700;
        font-size: 24px;
        z-index: 10;
    }
    .loading-indicator span { font-size: 10px; display: block; color: #888; }

    /* Cabecera / Navegación (Estilo Yenkoes pero Tech) */
    header {
        text-align: center;
        padding: 60px 20px 40px;
        position: relative;
    }
    
    .logo-container h1 {
        font-size: 3rem;
        margin: 0;
        color: var(--endfield-white);
        letter-spacing: 4px;
        text-transform: uppercase;
    }
    
    .logo-container p {
        color: var(--endfield-yellow);
        font-size: 0.9rem;
        letter-spacing: 2px;
        margin-top: 5px;
        font-weight: 600;
    }

    nav {
        margin-top: 30px;
        display: flex;
        justify-content: center;
        gap: 30px;
        border-bottom: 1px solid var(--ui-border);
        padding-bottom: 20px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }

    nav a {
        color: var(--endfield-text);
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 1px;
        position: relative;
        transition: color 0.3s ease;
        text-transform: uppercase;
    }

    nav a:hover {
        color: var(--endfield-yellow);
    }

    nav a::before {
        content: '>';
        opacity: 0;
        position: absolute;
        left: -15px;
        color: var(--endfield-yellow);
        transition: opacity 0.3s ease;
    }

    nav a:hover::before { opacity: 1; }

    /* Galería de Imágenes (Estructura Yenkoes) */
    .gallery-section {
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .gallery-track {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 20px;
        /* Ocultar barra de scroll para un look más limpio */
        scrollbar-width: none; 
    }
    .gallery-track::-webkit-scrollbar { display: none; }

    /* Tarjetas de Ilustración */
    .gallery-card {
        flex: 0 0 auto;
        width: 300px;
        height: 500px;
        background-color: var(--endfield-dark);
        border: 1px solid var(--ui-border);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s ease, border-color 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Imagen placeholder (Reemplazar con etiquetas <img> en producción) */
    .gallery-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.8;
        transition: opacity 0.3s ease, transform 0.5s ease;
    }

    .gallery-card:hover {
        border-color: var(--endfield-yellow);
        transform: translateY(-5px);
    }

    .gallery-card:hover img {
        opacity: 1;
        transform: scale(1.05);
    }

    /* Etiqueta tech en la esquina de la tarjeta */
    .card-label {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background-color: rgba(17, 17, 17, 0.8);
        color: var(--endfield-white);
        padding: 4px 8px;
        font-size: 0.75rem;
        border-left: 2px solid var(--endfield-yellow);
        letter-spacing: 1px;
    }

    /* Pie de página (Footer Endfield) */
    footer {
        margin-top: 60px;
        padding: 40px 20px;
        background-color: var(--endfield-dark);
        border-top: 1px solid var(--ui-border);
        text-align: center;
    }

    .social-links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .social-links a {
        color: var(--endfield-white);
        text-decoration: none;
        border: 1px solid var(--ui-border);
        padding: 8px 20px;
        font-size: 0.9rem;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }

    .social-links a:hover {
        background-color: var(--endfield-yellow);
        color: var(--endfield-bg);
        border-color: var(--endfield-yellow);
    }

    .footer-text {
        color: #666;
        font-size: 0.8rem;
        margin: 5px 0;
        letter-spacing: 0.5px;
    }

    /* Responsivo para móviles */
    @media (max-width: 768px) {
        .gallery-card {
            width: 240px;
            height: 400px;
        }
        nav { flex-wrap: wrap; gap: 15px; }
        .logo-container h1 { font-size: 2rem; }
    }
</style>
</head>
<body>

    <div class="bg-pattern"></div>
    <div class="side-accent"></div>
    
    <div class="loading-indicator">
        95%

    <header>

        <nav>

    <!-- GALERÍA HORIZONTAL -->
    <section class="gallery-section" id="gallery">
        <div class="gallery-track">
            
            <!-- TARJETA 1 -->
            <div class="gallery-card">

                <img src="https://via.placeholder.com/300x500/222222/555555?text=Art+01" alt="Artwork 1">

            <!-- TARJETA 2 -->

                <img src="https://via.placeholder.com/300x500/222222/555555?text=Art+02" alt="Artwork 2">
                <div class="card-label">02 / PROJECT</div>
            </div>

            <!-- TARJETA 3 -->
            <div class="gallery-card">
                <img src="https://via.placeholder.com/300x500/222222/555555?text=Art+03" alt="Artwork 3">
                <div class="card-label">03 / PROJECT</div>
            </div>
            
            <!-- TARJETA 4 -->
            <div class="gallery-card">
                <img src="https://via.placeholder.com/300x500/222222/555555?text=Art+04" alt="Artwork 4">
                <div class="card-label">04 / PROJECT</div>
            </div>

            <!-- TARJETA 5 -->
            <div class="gallery-card">
                <img src="https://via.placeholder.com/300x500/222222/555555?text=Art+05" alt="Artwork 5">
                <div class="card-label">05 / PROJECT</div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer id="contact">
        <div class="social-links">
            <!-- Puedes reemplazar el texto por iconos de FontAwesome si los enlazas -->
            <a href="#">TWITTER</a>
            <a href="#">VGEN</a>
            <a href="#">INSTAGRAM</a>
        </div>
        <p class="footer-text">Contact: tu-correo@gmail.com</p>
        <p class="footer-text">© 2026 Tu Nombre. Characters displayed in fanart belong to their respective owners.</p>
    </footer>

</body>
</html>
